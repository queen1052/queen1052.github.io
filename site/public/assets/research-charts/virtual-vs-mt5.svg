<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Gold 가상매매와 US100Cash MT5 비교</title>
  <desc id="desc">Gold Rust1과 Codex1 가상매매, US100Cash MT5의 누적 손익을 막대로 비교하고 확인 거래 건수를 선으로 표시한 차트</desc>
  <rect width="960" height="520" rx="24" fill="#0b1220"/>
  <rect x="32" y="32" width="896" height="456" rx="18" fill="#111c2e" stroke="#263852"/>
  <text x="72" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">가상매매와 MT5 실매매 비교</text>
  <text x="72" y="106" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Gold는 가상매매 · US100Cash는 실매매 손익이지만 실행 증거 미확인</text>
  <g stroke="#263852" stroke-width="1"><line x1="112" y1="156" x2="820" y2="156"/><line x1="112" y1="208" x2="820" y2="208"/><line x1="112" y1="260" x2="820" y2="260"/><line x1="112" y1="312" x2="820" y2="312"/><line x1="112" y1="364" x2="820" y2="364"/><line x1="112" y1="416" x2="820" y2="416"/></g>
  <g fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="end"><text x="102" y="160">+8M</text><text x="102" y="212">+4M</text><text x="102" y="264">0</text><text x="102" y="316">-4M</text><text x="102" y="368">-8M</text><text x="102" y="420">-12M</text></g>
  <line x1="112" y1="260" x2="820" y2="260" stroke="#64748b" stroke-width="2"/><line x1="112" y1="140" x2="112" y2="430" stroke="#64748b" stroke-width="2"/><line x1="820" y1="140" x2="820" y2="430" stroke="#64748b" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="11" text-anchor="middle"><rect x="170" y="213.4" width="120" height="46.6" rx="8" fill="#f59e0b"/><rect x="406" y="223.4" width="120" height="36.6" rx="8" fill="#38bdf8"/><rect x="642" y="260" width="120" height="163.8" rx="8" fill="#f43f5e"/><text x="230" y="205" fill="#fbbf24" font-weight="700">+3,586,500</text><text x="466" y="215" fill="#7dd3fc" font-weight="700">+2,818,500</text><text x="702" y="400" fill="#fff" font-weight="700">−12,601,680</text><text x="230" y="452" fill="#cbd5e1">GOLD · Rust1</text><text x="466" y="452" fill="#cbd5e1">GOLD · Codex1</text><text x="702" y="452" fill="#cbd5e1">US100Cash · MT5</text></g>
  <path d="M230 392 L466 334 L702 190" fill="none" stroke="#a7f3d0" stroke-width="3"/><g fill="#a7f3d0" stroke="#111c2e" stroke-width="3"><circle cx="230" cy="392" r="6"/><circle cx="466" cy="334" r="6"/><circle cx="702" cy="190" r="6"/></g>
  <g fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12"><text x="830" y="160">거래 10건</text><text x="830" y="264">5건</text><text x="830" y="420">0건</text><text x="72" y="470">막대: 누적 손익 · 초록 선: 확인 거래 수 (2건, 4건, 9건)</text></g>
  <g transform="translate(500 62)" font-family="Arial, sans-serif" font-size="11"><rect width="14" height="14" rx="3" fill="#f59e0b"/><text x="20" y="12" fill="#cbd5e1">Rust1 Virtual</text><rect x="112" width="14" height="14" rx="3" fill="#38bdf8"/><text x="132" y="12" fill="#cbd5e1">Codex1 Virtual</text><rect x="252" width="14" height="14" rx="3" fill="#f43f5e"/><text x="272" y="12" fill="#cbd5e1">MT5 Real</text></g>
</svg>
